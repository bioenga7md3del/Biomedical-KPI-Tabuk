<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تقرير الصيانة الطبية - تجمع تبوك</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }
body { font-family: 'Tajawal', sans-serif; background: #e2e8f0; color: #0f172a; padding: 20px; margin: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.page { background: #fff; max-width: 210mm; margin: 0 auto; padding: 14mm 12mm; min-height: 297mm; box-shadow: 0 10px 25px rgba(15,23,42,.15); border-radius: 6px; }

.header { display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--accent, #1e3a8a); padding-bottom: 14px; margin-bottom: 20px; gap: 12px; }
.h-logo { height: 68px; object-fit: contain; }
.h-title h1 { font-size: 1.7rem; margin: 0; color: var(--accent, #1e3a8a); font-weight: 800; }
.h-title p { margin: 6px 0 0; color: #475569; font-weight: 700; font-size: 1rem; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.chip { background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 999px; padding: 3px 12px; font-size: .8rem; font-weight: 700; color: #334155; }

.summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
.kpi-box { border: 1px solid #e2e8f0; padding: 12px 10px; text-align: center; border-radius: 10px; background: #f8fafc; border-top: 4px solid var(--c, #1e3a8a); }
.kpi-num { font-size: 1.9rem; font-weight: 800; color: var(--c, #1e293b); display: block; line-height: 1.15; }
.kpi-txt { font-size: .85rem; color: #475569; font-weight: 700; }
.kpi-sub { display: block; font-size: .72rem; color: #64748b; font-weight: 600; margin-top: 2px; }

.charts { display: flex; gap: 14px; height: 240px; margin-bottom: 16px; }
.chart-card { border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; align-items: center; }
.chart-card .t { font-weight: 800; color: #475569; margin-bottom: 6px; font-size: .9rem; }
.chart-card .box { flex: 1; width: 100%; min-height: 0; position: relative; }

h2 { font-size: 1.05rem; border-right: 5px solid var(--accent, #1e3a8a); margin: 22px 0 10px; background: #f8fafc; padding: 8px 12px; border-radius: 4px; color: #1e293b; }
table { width: 100%; border-collapse: collapse; font-size: .82rem; margin-bottom: 14px; }
th, td { border: 1px solid #cbd5e1; padding: 7px 8px; text-align: center; }
th { background: var(--accent, #1e3a8a); color: #fff; font-weight: 700; }
thead { display: table-header-group; }
tr { page-break-inside: avoid; }
tbody tr:nth-child(even) { background: #f8fafc; }
td.l { text-align: right; font-weight: 700; }
.g { color: #16a34a; font-weight: 800; } .r { color: #dc2626; font-weight: 800; } .y { color: #ca8a04; font-weight: 800; }
.pct { font-weight: 800; border-radius: 4px; padding: 2px 8px; display: inline-block; }
.pct.hi { background: #dcfce7; color: #166534; } .pct.mid { background: #fef08a; color: #854d0e; } .pct.lo { background: #fee2e2; color: #991b1b; }
.note { font-size: .78rem; color: #64748b; margin: -6px 0 12px; font-weight: 600; }

.sign { display: flex; justify-content: space-between; gap: 30px; margin-top: 40px; }
.sign div { flex: 1; text-align: center; font-weight: 700; font-size: .85rem; color: #475569; }
.sign div span { display: block; margin-top: 38px; border-top: 1px solid #94a3b8; padding-top: 4px; }
.footer { margin-top: 26px; text-align: center; font-size: .8rem; color: #64748b; border-top: 1px solid #e2e8f0; padding-top: 10px; font-weight: 600; }

.btn-print { position: fixed; top: 20px; left: 20px; padding: 12px 24px; background: #16a34a; color: #fff; border: none; cursor: pointer; font-weight: 800; font-family: 'Tajawal'; font-size: 1rem; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,.15); }
.btn-print:hover { background: #15803d; }

@media print {
@page { size: A4; margin: 10mm; }
body { padding: 0; background: #fff; }
.page { box-shadow: none; margin: 0; padding: 0; max-width: 100%; border-radius: 0; min-height: 0; }
.btn-print { display: none; }
.page-break { page-break-before: always; }
}
</style>
</head>
<body>

<button class="btn-print" onclick="window.print()">طباعة أو حفظ كـ PDF</button>

<div class="page" id="page">
<div class="header">
<div class="h-title">
<h1 id="reportTitle">تقرير الأداء الفني</h1>
<p id="reportMeta">جاري تحميل البيانات...</p>
<div class="chips" id="chips"></div>
</div>
<img src="TabukCluster.jpeg" class="h-logo" alt="Logo" onerror="this.style.display='none'">
</div>

<div class="summary-grid" id="kpiGrid"></div>

<div class="charts">
<div class="chart-card" style="flex:1"><div class="t" id="chart1Title">توزيع الحالات</div><div class="box"><canvas id="chartDonut"></canvas></div></div>
<div class="chart-card" style="flex:2"><div class="t" id="chart2Title">أداء المواقع</div><div class="box"><canvas id="chartBar"></canvas></div></div>
</div>

<h2>أداء المواقع (Sites Performance)</h2>
<table id="tblSites"><thead></thead><tbody></tbody></table>

<h2>أداء الفنيين (Technicians Performance)</h2>
<table id="tblTechs"><thead></thead><tbody></tbody></table>

<h2 id="openTitle">الأوامر المفتوحة</h2>
<div class="note" id="openNote"></div>
<table id="tblOpen"><thead></thead><tbody></tbody></table>

<div class="sign">
<div><span>إعداد</span></div>
<div><span>مراجعة</span></div>
<div><span>اعتماد</span></div>
</div>

<div class="footer">
إدارة الصيانة - قسم الصيانة الطبية | تجمع تبوك الصحي<br>
تاريخ الطباعة: <span id="printDate" style="direction:ltr; display:inline-block;"></span>
</div>
</div>

<script>
const TARGET = 90;
const DAY = 86400000;
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function kpi(num, txt, color, sub) { return '<div class="kpi-box" style="--c:' + color + '"><span class="kpi-num">' + num + '</span><span class="kpi-txt">' + txt + '</span>' + (sub ? '<span class="kpi-sub">' + sub + '</span>' : '') + '</div>'; }
function pctCls(p) { return p >= TARGET ? 'hi' : (p >= 70 ? 'mid' : 'lo'); }
function pctCell(p) { return '<span class="pct ' + pctCls(p) + '">' + p + '%</span>'; }
function fd(v) { if (!v) return '-'; const d = new Date(v); return isNaN(d.getTime()) ? '-' : d.toLocaleDateString('en-GB'); }
function ms(v) { if (!v) return null; const d = new Date(v); return isNaN(d.getTime()) ? null : d.getTime(); }

window.onload = function () {
const rawData = sessionStorage.getItem('REPORT_DATA');
const metaStr = sessionStorage.getItem('REPORT_META');
if (!rawData || !metaStr) {
document.body.innerHTML = '<h1 style="text-align:center; margin-top:50px; color:#dc2626; font-family:Tajawal">لا توجد بيانات للعرض. يرجى فتح التقرير من لوحة المؤشرات.</h1>';
return;
}
const data = JSON.parse(rawData);
const meta = JSON.parse(metaStr);
const isPPM = meta.mode === 'PPM';
Chart.defaults.font.family = 'Tajawal';
Chart.defaults.animation = false;

document.documentElement.style.setProperty('--accent', isPPM ? '#15803d' : '#1e3a8a');
document.getElementById('reportTitle').textContent = isPPM ? 'تقرير الصيانة الوقائية (PPM)' : 'تقرير الصيانة التصحيحية (CM)';
document.getElementById('reportMeta').textContent = (isPPM ? 'حتى شهر: ' : 'الفترة: ') + meta.date + ' • النطاق: ' + (meta.site === 'All' ? 'كل المواقع' : meta.site);
document.getElementById('chips').innerHTML = '<span class="chip">' + data.length + ' أمر</span>' + (meta.site !== 'All' ? '<span class="chip">' + esc(meta.site) + '</span>' : '<span class="chip">كل المواقع</span>');
document.getElementById('printDate').textContent = new Date().toLocaleString('en-GB');
document.title = (isPPM ? 'PPM' : 'CM') + ' Report - ' + meta.date;

if (isPPM) renderPPM(data); else renderCM(data);
};

function avg(a) { return a.length ? a.reduce(function (x, y) { return x + y; }, 0) / a.length : null; }

function renderPPM(data) {
const total = data.length;
const done = data.filter(function (d) { return d.category === 'done'; }).length;
const prog = data.filter(function (d) { return d.category === 'progress'; }).length;
const delayed = data.filter(function (d) { return d.category === 'delayed'; });
const rate = total ? Math.round(done / total * 100) : 0;
const oldest = delayed.reduce(function (a, r) { const t = ms(r.dStart); return t ? Math.max(a, Math.floor((Date.now() - t) / DAY)) : a; }, 0);
const rc = pctCls(rate) === 'hi' ? '#16a34a' : (pctCls(rate) === 'mid' ? '#ca8a04' : '#dc2626');

document.getElementById('kpiGrid').innerHTML =
kpi(total, 'المستحق', '#1e3a8a') +
kpi(done, 'تم الإنجاز', '#16a34a') +
kpi(rate + '%', 'نسبة الالتزام', rc, 'المستهدف ' + TARGET + '%') +
kpi(prog, 'مجدول / تحت الإجراء', '#ca8a04') +
kpi(delayed.length, 'متأخر', '#dc2626') +
kpi(oldest, 'أقدم تأخير (يوم)', '#ea580c');

document.getElementById('chart2Title').textContent = 'نسبة الالتزام حسب الموقع (%)';
document.getElementById('tblSites').querySelector('thead').innerHTML = document.getElementById('tblTechs').querySelector('thead').innerHTML =
'<tr><th>الاسم</th><th>الإجمالي</th><th>منجز</th><th>مجدول / تحت الإجراء</th><th>متأخر</th><th>نسبة الالتزام</th></tr>';
groupTable(data, 'tblSites', 'site', true);
groupTable(data, 'tblTechs', 'tech', true);

drawDonut(['منجز', 'مجدول/تحت الإجراء', 'متأخر'], [done, prog, delayed.length], ['#16a34a', '#eab308', '#dc2626']);
drawBar(data, true);

// delayed orders
document.getElementById('openTitle').textContent = 'الأوامر المتأخرة (الأقدم أولاً)';
const rows = delayed.slice().sort(function (a, b) { return (ms(a.dStart) || 0) - (ms(b.dStart) || 0); });
openTable(rows, ['رقم الأمر', 'الاستحقاق', 'أيام التأخر', 'الموقع', 'الجهاز', 'الفني'], function (r) {
const t = ms(r.dStart);
return [esc(r.id), fd(r.dStart), t ? Math.max(0, Math.floor((Date.now() - t) / DAY)) : '-', esc(r.site), esc(String(r.device).substring(0, 34)), esc(r.tech)];
});
}

function renderCM(data) {
const total = data.length;
const openArr = data.filter(function (d) { return d.isOpen; });
const closedArr = data.filter(function (d) { return !d.isOpen; });
const rate = total ? Math.round(closedArr.length / total * 100) : 0;
const aR = avg(closedArr.map(function (r) { return r.resp || 0; }));
const aF = avg(closedArr.map(function (r) { return r.fix || 0; }));

document.getElementById('kpiGrid').innerHTML =
kpi(total, 'إجمالي البلاغات', '#1e3a8a') +
kpi(closedArr.length, 'تم الإصلاح', '#16a34a') +
kpi(openArr.length, 'مفتوح حالياً', '#dc2626') +
kpi(rate + '%', 'نسبة الإنجاز', '#1e293b') +
kpi(aR == null ? '-' : aR.toFixed(1), 'متوسط الاستجابة', '#ea580c', 'أيام (Fail → Start)') +
kpi(aF == null ? '-' : aF.toFixed(1), 'متوسط الإصلاح', '#0891b2', 'أيام (Fail → Closed)');

document.getElementById('chart2Title').textContent = 'نسبة الإنجاز حسب الموقع (%)';
document.getElementById('tblSites').querySelector('thead').innerHTML = document.getElementById('tblTechs').querySelector('thead').innerHTML =
'<tr><th>الاسم</th><th>الإجمالي</th><th>تم الإصلاح</th><th>مفتوح</th><th>نسبة الإنجاز</th><th>Avg Resp</th><th>Avg Repair</th></tr>';
groupTable(data, 'tblSites', 'site', false);
groupTable(data, 'tblTechs', 'tech', false);

drawDonut(['تم الإصلاح', 'أعطال مفتوحة'], [closedArr.length, openArr.length], ['#16a34a', '#dc2626']);
drawBar(data, false);

document.getElementById('openTitle').textContent = 'الأعطال المفتوحة (الأقدم أولاً)';
const rows = openArr.slice().sort(function (a, b) { return (ms(a.dFail) || 0) - (ms(b.dFail) || 0); });
openTable(rows, ['رقم الأمر', 'تاريخ العطل', 'أيام التأخير', 'الموقع', 'الجهاز', 'الفني', 'الحالة'], function (r) {
const t = ms(r.dFail);
return [esc(r.id), fd(r.dFail), t ? Math.max(0, Math.floor((Date.now() - t) / DAY)) : '-', esc(r.site), esc(String(r.device).substring(0, 34)), esc(r.tech), esc(r.status)];
});
}

function openTable(rows, heads, fn) {
const MAX = 80;
document.getElementById('openNote').textContent = rows.length > MAX ? ('عرض أول ' + MAX + ' أمر من أصل ' + rows.length + ' - راجع اللوحة أو ملف Excel للقائمة الكاملة') : ('عدد الأوامر: ' + rows.length);
document.getElementById('tblOpen').querySelector('thead').innerHTML = '<tr>' + heads.map(function (h) { return '<th>' + h + '</th>'; }).join('') + '</tr>';
const tb = document.getElementById('tblOpen').querySelector('tbody');
if (!rows.length) { tb.innerHTML = '<tr><td colspan="' + heads.length + '" style="padding:16px; font-weight:800; color:#16a34a">لا توجد أوامر مفتوحة</td></tr>'; return; }
tb.innerHTML = rows.slice(0, MAX).map(function (r) { return '<tr>' + fn(r).map(function (c, i) { return '<td' + (i === 0 ? ' class="l"' : '') + '>' + c + '</td>'; }).join('') + '</tr>'; }).join('');
}

function groupTable(data, tableId, key, isPPM) {
const grp = {};
data.forEach(function (r) {
const k = r[key];
if (!grp[k]) grp[k] = { t: 0, d: 0, p: 0, l: 0, o: 0, rs: 0, fs: 0, n: 0 };
const g = grp[k]; g.t++;
if (isPPM) { if (r.category === 'done') g.d++; else if (r.category === 'progress') g.p++; else g.l++; }
else { if (r.isOpen) g.o++; else { g.d++; g.rs += (r.resp || 0); g.fs += (r.fix || 0); g.n++; } }
});
const tb = document.querySelector('#' + tableId + ' tbody');
tb.innerHTML = Object.entries(grp).sort(function (a, b) { return b[1].t - a[1].t; }).map(function (e) {
const k = e[0], v = e[1];
const pct = v.t ? Math.round(v.d / v.t * 100) : 0;
if (isPPM) return '<tr><td class="l">' + esc(k) + '</td><td>' + v.t + '</td><td class="g">' + v.d + '</td><td class="y">' + v.p + '</td><td class="r">' + v.l + '</td><td>' + pctCell(pct) + '</td></tr>';
return '<tr><td class="l">' + esc(k) + '</td><td>' + v.t + '</td><td class="g">' + v.d + '</td><td class="r">' + v.o + '</td><td>' + pctCell(pct) + '</td><td>' + (v.n ? (v.rs / v.n).toFixed(1) : '-') + '</td><td>' + (v.n ? (v.fs / v.n).toFixed(1) : '-') + '</td></tr>';
}).join('');
}

function drawDonut(labels, vals, colors) {
new Chart(document.getElementById('chartDonut'), {
type: 'doughnut',
data: { labels: labels, datasets: [{ data: vals, backgroundColor: colors, borderWidth: 2, borderColor: '#fff' }] },
options: { responsive: true, maintainAspectRatio: false, cutout: '62%', plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } } }
});
}

function drawBar(data, isPPM) {
const grp = {};
data.forEach(function (r) {
const k = r.site;
if (!grp[k]) grp[k] = { t: 0, c: 0 };
grp[k].t++;
if (isPPM ? r.category === 'done' : !r.isOpen) grp[k].c++;
});
const sorted = Object.entries(grp).map(function (e) { return { name: e[0], rate: Math.round(e[1].c / e[1].t * 100) }; }).sort(function (a, b) { return b.rate - a.rate; }).slice(0, 10);
new Chart(document.getElementById('chartBar'), {
type: 'bar',
data: { labels: sorted.map(function (x) { return x.name.length > 20 ? x.name.substring(0, 20) + '…' : x.name; }), datasets: [{ data: sorted.map(function (x) { return x.rate; }), backgroundColor: sorted.map(function (x) { return x.rate >= TARGET ? '#16a34a' : (x.rate >= 70 ? '#eab308' : '#dc2626'); }), borderRadius: 4 }] },
options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { min: 0, max: 100 }, y: { ticks: { font: { size: 10 } } } } }
});
}
</script>

</body>
</html>
